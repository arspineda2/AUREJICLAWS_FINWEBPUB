<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="/" />
  <title>Aureji Claws - Orders</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alice&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin.css" />
  <script src="/js/admin-pages.js" defer></script>
</head>
<body>

  <!-- ========================================== -->
  <!-- ======== SIDE BAR AND BURGER MENU ======== -->
  <!-- ========================================== -->
   
  <!-- BURGER MENU STATE (must stay a direct child of body, before header + main body) -->
  <input type="checkbox" id="navToggle" class="nav-toggle" hidden>
  <label for="navToggle" class="nav-overlay" aria-hidden="true"></label>

  <!-- Header -->
  <header class="dash-header">
    <div class="flex items-center gap-3">
      <!-- Burger button (visible on tablet / mobile only) -->
      <label for="navToggle" class="burger-btn" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </label>
      <div class="dash-logo-box">
        <img src="photos/Logo.png" alt="Logo" onerror="applyImgFallback(this, 'A')" />
      </div>
      <h1 class="font-alice text-2xl text-dustyPink">Admin Dashboard</h1>
    </div>
    <div class="flex items-center gap-6 text-sm header-actions-wrap">
      <span class="text-textDark font-medium">admin</span>
      <a href="/login.html" onclick="adminPageLogout(event)" class="text-danger hover:underline font-medium">Log out</a>
    </div>
  </header>

  <!-- Main Body -->
  <div class="dash-main-body">
    <!-- Left Sidebar Navigation -->
    <aside class="dash-sidebar">
      <!-- Home Dropdown -->
      <div>
        <button class="nav-dropdown-btn" onclick="toggleSubMenu('homeSub')">
          <span>Home</span>
        </button>
        <div id="homeSub" class="nav-submenu">
          <a href="/admin/hero" class="nav-sublink">Hero page</a>
          <a href="/admin/instagram" class="nav-sublink">Instagram Posts</a>
        </div>
      </div>

      <!-- Press-on Dropdown -->
      <div>
        <button class="nav-dropdown-btn" onclick="toggleSubMenu('pressSub')">
          <span>Press-on</span>
        </button>
        <div id="pressSub" class="nav-submenu" hidden>
          <a href="/admin/products" class="nav-sublink">Products</a>
          <a href="/admin/orders" class="nav-sublink active">Orders</a>
        </div>
      </div>

      <!-- Services Dropdown -->
      <div>
        <button class="nav-dropdown-btn" onclick="toggleSubMenu('servSub')">
          <span>Services</span>
        </button>
        <div id="servSub" class="nav-submenu" hidden>
          <a href="/admin/services" class="nav-sublink">Services List</a>
          <a href="/admin/bookings" class="nav-sublink">Booked</a>
        </div>
      </div>

      <!-- Log out (shown only inside the burger drawer on tablet / mobile) -->
      <div class="sidebar-logout">
        <a href="/login.html" onclick="adminPageLogout(event)" class="sidebar-logout-btn">Log out</a>
      </div>
    </aside>

    <!-- ========================================== -->
      <!-- ======== EDIT ORDERS PAGE ======== -->
     <!-- ========================================== -->

    <!-- Center Workspace -->
    <main class="dash-content-area">
      <div class="dash-content-inner">
        <h2 class="font-alice text-3xl text-periwinkleTitle">Orders</h2>

        <!-- Orders Container (Dynamic) -->
        <div id="ordersContainer" class="flex flex-col gap-6">
          <!-- Injected via JavaScript -->
        </div>
      </div>
    </main>
  </div>

  <!-- Toast Notification -->
  <div id="toastNotification"></div>

  <script>
    function applyImgFallback(imgElement, text) {
      const parent = imgElement.parentElement;
      const fallback = document.createElement('span');
      fallback.textContent = text;
      parent.replaceChildren(fallback);
    }

    function showToast(message) {
      const toast = document.getElementById('toastNotification');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => { toast.classList.remove('show'); }, 3500);
    }

    function toggleSubMenu(id) {
      const el = document.getElementById(id);
      const isHidden = el.hidden;
      el.hidden = !isHidden;
      const iconId = id.replace('Sub', 'Icon');
      document.getElementById(iconId).textContent = isHidden ? '\u25B2' : '\u25BC';
    }
  </script>
  <script src="/js/admin-orders.js"></script>
</body>
</html>
